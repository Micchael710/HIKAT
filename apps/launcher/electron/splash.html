<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>HiKAT Loading</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-drag: none;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100vw;
      height: 100vh;
      background: transparent !important;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    .splash-container {
      position: relative;
      width: 680px;
      height: 390px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: transparent !important;
      animation: splashFadeIn 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes splashFadeIn {
      from {
        opacity: 0;
        transform: scale(0.94);
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    /* Ambient background backlight inside the card */
    .ambient-glow {
      position: absolute;
      width: 480px;
      height: 260px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(41, 83, 114, 0.35) 0%, rgba(28, 56, 78, 0.12) 45%, transparent 70%);
      filter: blur(40px);
      pointer-events: none;
      z-index: 1;
      animation: glowPulse 2.4s ease-in-out infinite alternate;
    }

    @keyframes glowPulse {
      0% {
        opacity: 0.5;
        transform: scale(0.92);
      }
      100% {
        opacity: 1;
        transform: scale(1.15);
      }
    }

    /* Animated Glowing Perimeter Beam */
    .beam-svg {
      position: absolute;
      inset: 0;
      width: 680px;
      height: 390px;
      overflow: visible;
      pointer-events: none;
      z-index: 2;
    }

    .track-rect {
      fill: #0d1319;
      stroke: rgba(255, 255, 255, 0.08);
      stroke-width: 2.8;
    }

    .traveling-beam {
      fill: none;
      stroke: url(#blueBeamGradient);
      stroke-width: 4.5;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-dasharray: 380 1680;
      animation: beamLoop 2.4s cubic-bezier(0.45, 0.05, 0.55, 0.95) infinite;
      filter: drop-shadow(0 0 10px #82c8e6) drop-shadow(0 0 22px rgba(90, 180, 220, 0.85));
    }

    /* Secondary companion beam for rich trailing neon look */
    .traveling-beam-trail {
      fill: none;
      stroke: url(#trailBeamGradient);
      stroke-width: 3;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-dasharray: 200 1860;
      animation: beamLoop 2.4s cubic-bezier(0.45, 0.05, 0.55, 0.95) infinite;
      filter: blur(1px) drop-shadow(0 0 28px rgba(90, 180, 220, 0.65));
    }

    @keyframes beamLoop {
      0% {
        stroke-dashoffset: 0;
      }
      100% {
        stroke-dashoffset: -2053;
      }
    }

    /* Centered HiKAT Logo */
    .logo-img {
      position: relative;
      z-index: 3;
      max-width: 480px;
      max-height: 205px;
      object-fit: contain;
      mix-blend-mode: screen;
      animation: logoBreathe 2.4s ease-in-out infinite alternate;
      pointer-events: none;
    }

    @keyframes logoBreathe {
      0% {
        transform: scale(0.98);
        opacity: 0.92;
        filter: drop-shadow(0 0 10px rgba(255, 255, 255, 0.15));
      }
      100% {
        transform: scale(1.02);
        opacity: 1;
        filter: drop-shadow(0 0 26px rgba(90, 180, 220, 0.45));
      }
    }

    .logo-img.updating {
      transform: translateY(-24px);
      transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }

    /* Hide animated glowing beams in update mode */
    .splash-container.updating .traveling-beam,
    .splash-container.updating .traveling-beam-trail {
      display: none !important;
      opacity: 0 !important;
      animation: none !important;
    }

    /* Updater overlay and progress bar */
    .updater-container {
      position: absolute;
      bottom: 40px;
      left: 50%;
      transform: translateX(-50%);
      width: 480px;
      z-index: 4;
      display: flex;
      flex-direction: column;
      gap: 10px;
      opacity: 1;
      transition: opacity 0.3s ease;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    .updater-container.hidden {
      display: none;
      opacity: 0;
    }

    .updater-status-line {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
      font-weight: 700;
    }

    .updater-status-text {
      color: #82c8e6;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      font-weight: 700;
    }

    .updater-percent {
      color: #82c8e6;
      font-variant-numeric: tabular-nums;
      font-weight: 700;
      letter-spacing: 0.5px;
    }

    /* Minimalist, sober progress bar */
    .updater-progress-track {
      width: 100%;
      height: 4px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 999px;
      overflow: hidden;
    }

    .updater-progress-fill {
      width: 0%;
      height: 100%;
      background: #82c8e6;
      border-radius: 999px;
      transition: width 0.2s ease-out;
    }

    .updater-metrics-line {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 11px;
      color: rgba(255, 255, 255, 0.45);
      font-variant-numeric: tabular-nums;
    }

    .updater-submessage {
      display: none;
      font-size: 12px;
      color: rgba(255, 255, 255, 0.7);
      text-align: center;
      letter-spacing: 0.2px;
      margin-top: 2px;
    }
  </style>
</head>
<body>
  <div class="splash-container">
    <div class="ambient-glow"></div>

    <!-- Animated Glowing Perimeter Beam -->
    <svg class="beam-svg" viewBox="0 0 680 390">
      <defs>
        <linearGradient id="blueBeamGradient" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#a0e6ff" stop-opacity="1" />
          <stop offset="35%" stop-color="#82c8e6" stop-opacity="1" />
          <stop offset="80%" stop-color="#33678e" stop-opacity="0.85" />
          <stop offset="100%" stop-color="#1c384e" stop-opacity="0" />
        </linearGradient>

        <linearGradient id="trailBeamGradient" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9" />
          <stop offset="60%" stop-color="#82c8e6" stop-opacity="0.4" />
          <stop offset="100%" stop-color="transparent" stop-opacity="0" />
        </linearGradient>
      </defs>

      <!-- Base Card Track -->
      <rect class="track-rect" x="4" y="4" width="672" height="382" rx="32" ry="32" />

      <!-- Glowing Neon Beams -->
      <rect class="traveling-beam-trail" x="4" y="4" width="672" height="382" rx="32" ry="32" />
      <rect class="traveling-beam" x="4" y="4" width="672" height="382" rx="32" ry="32" />
    </svg>

    <!-- HiKAT White Logo -->
    <img src="splash-logo.png" alt="HiKAT" class="logo-img" />

    <!-- Updater Progress Box -->
    <div id="updater-container" class="updater-container hidden">
      <div class="updater-status-line">
        <span id="updater-status-text" class="updater-status-text">DESCARGANDO ACTUALIZACION</span>
        <span id="updater-percent" class="updater-percent">0%</span>
      </div>
      <div class="updater-progress-track">
        <div id="updater-progress-fill" class="updater-progress-fill"></div>
      </div>
      <div id="updater-metrics-line" class="updater-metrics-line">
        <span id="updater-size">0 MB / 0 MB</span>
        <span id="updater-speed">0 MB/s</span>
      </div>
      <div id="updater-submessage" class="updater-submessage">
        HiKAT se reiniciará automáticamente al finalizar.
      </div>
    </div>
  </div>

  <script>
    if (window.splashAPI) {
      window.splashAPI.onUpdateStatus(function(status) {
        var container = document.getElementById("updater-container");
        var splash = document.querySelector(".splash-container");
        var logo = document.querySelector(".logo-img");
        var statusEl = document.getElementById("updater-status-text");
        var submessageEl = document.getElementById("updater-submessage");
        var metricsLine = document.getElementById("updater-metrics-line");
        var percentEl = document.getElementById("updater-percent");
        var fill = document.getElementById("updater-progress-fill");

        if (container) container.classList.remove("hidden");
        if (splash) splash.classList.add("updating");
        if (logo) logo.classList.add("updating");

        if (status && status.state === "installing") {
          if (statusEl) statusEl.textContent = status.message || "INSTALANDO ACTUALIZACION";
          if (submessageEl) {
            submessageEl.textContent = status.submessage || "HiKAT se reiniciará automáticamente al finalizar.";
            submessageEl.style.display = "block";
          }
          if (metricsLine) metricsLine.style.display = "none";
          if (percentEl) percentEl.textContent = "100%";
          if (fill) fill.style.width = "100%";
        } else {
          if (statusEl && status && status.message) {
            statusEl.textContent = status.message;
          } else if (statusEl) {
            statusEl.textContent = "DESCARGANDO ACTUALIZACION";
          }
          if (submessageEl) submessageEl.style.display = "none";
          if (metricsLine) metricsLine.style.display = "flex";
        }
      });

      window.splashAPI.onUpdateProgress(function(progress) {
        var container = document.getElementById("updater-container");
        var splash = document.querySelector(".splash-container");
        var logo = document.querySelector(".logo-img");
        if (container) container.classList.remove("hidden");
        if (splash) splash.classList.add("updating");
        if (logo) logo.classList.add("updating");

        var fill = document.getElementById("updater-progress-fill");
        var percentEl = document.getElementById("updater-percent");
        var sizeEl = document.getElementById("updater-size");
        var speedEl = document.getElementById("updater-speed");

        var pct = Math.min(100, Math.max(0, Math.round(progress.percent || 0)));
        if (fill) fill.style.width = pct + "%";
        if (percentEl) percentEl.textContent = pct + "%";

        var transferredMb = ((progress.transferred || 0) / (1024 * 1024)).toFixed(1);
        var totalMb = ((progress.total || 0) / (1024 * 1024)).toFixed(1);
        if (sizeEl) sizeEl.textContent = transferredMb + " MB / " + totalMb + " MB";

        var speedMb = ((progress.bytesPerSecond || 0) / (1024 * 1024)).toFixed(1);
        if (speedEl) speedEl.textContent = speedMb + " MB/s";
      });
    }
  </script>
</body>
</html>
